name: Build Windows exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name GalleryPckPatcher gallery_pck_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: GalleryPckPatcher
          path: dist/GalleryPckPatcher.exe
      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GalleryPckPatcher.exe
